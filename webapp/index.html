<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lumina — Telegram School OS</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Pinned Lucide Icons (v0.469.0 for stability) -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-logo">L</div>
        <div class="brand-text">
          <h1>Lumina</h1>
          <span id="schoolTitle">School OS</span>
        </div>
      </div>
      <div class="header-actions">
        <span class="role-badge" id="roleBadge">STUDENT</span>
        <button class="lang-btn" id="langToggleBtn">🇺🇿 UZ</button>
      </div>
    </header>

    <!-- Dev Role Switcher Bar (strictly displayed in local dev environments) -->
    <div id="devSwitcherBar" style="display:none;background:var(--bg-subtle);padding:6px 16px;border-bottom:1px solid var(--border-color);align-items:center;justify-content:space-between;font-size:11px;">
      <span style="color:var(--text-muted);font-weight:600;">Dev Perspective:</span>
      <select id="roleSwitcher" style="background:var(--bg-surface);border:1px solid var(--border-color);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;color:var(--text-primary);">
        <option value="STUDENT" selected>Ученик (Student)</option>
        <option value="TEACHER">Учитель (Teacher)</option>
        <option value="PARENT">Родитель (Parent)</option>
        <option value="ADMIN">Админ (Admin)</option>
      </select>
    </div>

    <!-- Main View Container -->
    <main class="view-container" id="viewContainer">
      <div class="loading-state" style="text-align:center;padding:40px;">
        <i data-lucide="loader-2" class="animate-spin" style="width:28px;height:28px;color:var(--color-primary);"></i>
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottomNav">
      <!-- Generated dynamically based on active role -->
    </nav>
  </div>

  <!-- App Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
