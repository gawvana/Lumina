databases:
  - name: lumina-postgres
    databaseName: lumina
    user: lumina_user
    plan: free

services:
  - type: web
    name: lumina-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: WEBAPP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://web.telegram.org,https://oauth.telegram.org"
